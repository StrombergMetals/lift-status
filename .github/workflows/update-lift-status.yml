name: Update Lift Status

on:
  repository_dispatch:
    types: [update_lift_status]

permissions:
  contents: write

concurrency:
  group: lift-status-updates
  queue: max

jobs:
  update-status:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Create lift data file
        shell: bash
        env:
          LIFT_ID: ${{ github.event.client_payload.liftId }}
          INSPECTOR: ${{ github.event.client_payload.inspector }}
          INSPECTION_DATE: ${{ github.event.client_payload.inspectionDate }}
          RESULT: ${{ github.event.client_payload.result }}
          FORM_URL: ${{ github.event.client_payload.formUrl }}
        run: |
          mkdir -p data

          SAFE_LIFT_ID=$(printf '%s' "$LIFT_ID" | sed 's/[^A-Za-z0-9._-]/_/g')

          jq -n \
            --arg liftId "$LIFT_ID" \
            --arg inspector "$INSPECTOR" \
            --arg inspectionDate "$INSPECTION_DATE" \
            --arg result "$RESULT" \
            --arg formUrl "$FORM_URL" \
            '{
              liftId: $liftId,
              inspector: $inspector,
              inspectionDate: $inspectionDate,
              result: $result,
              formUrl: $formUrl
            }' > "data/${SAFE_LIFT_ID}.json"

      - name: Commit updated lift data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update lift inspection status"
            git push
          fi
