name: Update Lift Status

on:
  repository_dispatch:
    types: [update_lift_status]

permissions:
  contents: write

jobs:
  update-page:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Confirm dispatch received
        run: |
          echo "Lift status update received from Power Automate."

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git status
